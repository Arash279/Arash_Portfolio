<title id="title">Code beyond its surface</title><desc id="desc">Two stylized HDL source panels feed one eight-feature code-pair representation. Repeated vector layers suggest numerical augmentation. Bar heights are illustrative; the separate random-control channel is omitted from this conceptual cover.</desc>
